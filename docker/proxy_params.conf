# ------------------------------------------------------------------ #
#  Proxy parameters — shared across all location blocks              #
#                                                                      #
#  These settings tell Nginx how to forward requests to FastAPI       #
#  and pass important headers through.                                #
# ------------------------------------------------------------------ #

# Forward the real client IP to FastAPI
# Without this, request.client.host in FastAPI would show
# Nginx's IP (127.0.0.1) instead of the real client IP
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Pass the original Host header through
proxy_set_header Host $http_host;

# Disable buffering for streaming responses (file downloads)
proxy_buffering off;
proxy_request_buffering off;

# Timeouts
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Disable redirect following — let FastAPI handle redirects
proxy_redirect off;

# HTTP version for upstream
proxy_http_version 1.1;
proxy_set_header Connection "";
