# ------------------------------------------------------------------ #
#  Nginx reverse proxy configuration                                  #
#                                                                      #
#  Nginx sits in front of your FastAPI app and handles:               #
#    - TLS termination (HTTPS)                                        #
#    - Security headers injection                                     #
#    - Rate limiting                                                  #
#    - HTTP → HTTPS redirect                                          #
#    - Request size limits                                            #
#                                                                      #
#  For local development you don't need this file —                  #
#  it is used in production deployment (Render uses it               #
#  automatically, or you use it on a VPS).                            #
# ------------------------------------------------------------------ #

# ---- Worker processes -------------------------------------------- #
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---- Logging format ------------------------------------------ #
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ---- Performance -------------------------------------------- #
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ---- Security — hide Nginx version -------------------------- #
    # Never tell attackers what software version you're running
    server_tokens off;

    # ---- Rate limiting zones ------------------------------------- #
    # General zone: 10 requests/second per IP (burst allowed)
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # Auth zone: 2 requests/second per IP — strict brute force guard
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

    # ---- HTTP server — redirect all traffic to HTTPS ------------ #
    server {
        listen 80;
        server_name _;

        # Redirect every HTTP request to HTTPS permanently
        return 301 https://$host$request_uri;
    }

    # ---- HTTPS server ------------------------------------------- #
    server {
        listen 443 ssl http2;
        server_name your-domain.com;    # replace with your actual domain

        # ---- TLS certificates ----------------------------------- #
        # For Render/Railway: they handle TLS for you — remove this block
        # For a VPS: use Let's Encrypt (certbot)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # ---- TLS hardening -------------------------------------- #
        # Accept only TLS 1.2 and 1.3 — reject older insecure versions
        ssl_protocols TLSv1.2 TLSv1.3;

        # Strong cipher suites only
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # Cache SSL sessions for 10 minutes — reduces handshake overhead
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # OCSP stapling — faster certificate validation for clients
        ssl_stapling on;
        ssl_stapling_verify on;

        # ---- Security headers ----------------------------------- #
        # HSTS — tell browsers to always use HTTPS for 1 year
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Prevent clickjacking — don't allow this site in an iframe
        add_header X-Frame-Options "DENY" always;

        # XSS protection for older browsers
        add_header X-XSS-Protection "1; mode=block" always;

        # Don't send referrer information to other sites
        add_header Referrer-Policy "no-referrer" always;

        # Restrict browser features
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

        # ---- Request limits ------------------------------------- #
        # Maximum upload size — must match MAX_UPLOAD_SIZE_MB in config
        client_max_body_size 52M;
        client_body_timeout 60s;
        client_header_timeout 60s;

        # ---- Rate limiting on auth endpoints -------------------- #
        location /auth/login {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://api:8000;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /auth/register {
            limit_req zone=auth burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://api:8000;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ---- All other routes ----------------------------------- #
        location / {
            limit_req zone=general burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://api:8000;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ---- Health check — no rate limiting needed ------------- #
        location /health {
            proxy_pass http://api:8000;
            access_log off;    # don't pollute logs with health checks
            include /etc/nginx/conf.d/proxy_params.conf;
        }
    }
}
