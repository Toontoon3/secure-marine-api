[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output settings
addopts =
    --verbose
    --tb=short
    --no-header
    -q

# Markers — used to categorise and selectively run tests
markers =
    auth: Authentication tests
    datasets: Dataset endpoint tests
    rbac: Role-based access control tests
    security: Security-focused tests
    health: Health check tests